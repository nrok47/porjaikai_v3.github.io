<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>หลังบ้าน - ร้านพอใจขาย</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen pb-10 font-sans">
  
  <div class="max-w-md mx-auto p-4 space-y-4">
    <div class="flex justify-between items-center mb-2">
      <div class="flex items-center space-x-2">
        <h1 class="text-2xl font-black text-slate-800">📊 จัดการร้าน</h1>
        <div id="statusDot" class="w-2.5 h-2.5 rounded-full bg-yellow-400 animate-pulse mt-1"></div>
      </div>
      <button onclick="loadAdminData()" id="btnRefresh" class="bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-xs font-bold active:scale-95 transition">🔄 อัปเดต</button>
    </div>

    <div class="bg-white p-5 rounded-3xl shadow-sm border-t-4 border-indigo-500">
      <h2 class="font-bold text-slate-500 text-sm mb-3">🛠️ จัดการเมนู (เพิ่ม/ลบ/แก้ไข)</h2>
      <div class="bg-indigo-50 p-4 rounded-2xl mb-4 shadow-inner">
        <input type="hidden" id="prodId">
        <input type="hidden" id="prodOldName">
        <div class="grid grid-cols-2 gap-2 mb-3">
          <input type="text" id="prodName" placeholder="ชื่อเมนู" class="col-span-2 p-2 rounded-lg border outline-none text-sm font-bold text-slate-700">
          <input type="number" id="prodPrice" placeholder="ราคา (฿)" class="p-2 rounded-lg border outline-none text-sm text-center">
          <input type="number" id="prodStock" placeholder="โควต้า/สต็อก" class="p-2 rounded-lg border outline-none text-sm text-center">
          <input type="text" id="prodImg" placeholder="URL รูปภาพ (ถ้ามี)" class="col-span-2 p-2 rounded-lg border outline-none text-sm text-slate-500">
        </div>
        <div class="flex space-x-2">
          <button onclick="saveProduct()" id="btnSaveProd" class="flex-1 bg-indigo-500 text-white py-2 rounded-xl font-bold shadow-md active:scale-95 transition">💾 บันทึก</button>
          <button onclick="clearProductForm()" class="bg-slate-300 text-slate-700 px-4 py-2 rounded-xl font-bold active:scale-95 transition">ล้าง</button>
        </div>
      </div>
      <div id="productCrudList" class="space-y-2 max-h-60 overflow-y-auto pr-1"></div>
    </div>

    <div class="bg-white p-5 rounded-3xl shadow-sm border-t-4 border-green-500">
      <h2 class="font-bold text-slate-500 text-sm mb-3">💰 สรุปการเงินวันนี้</h2>
      <div class="text-center mb-4">
        <p class="text-xs text-slate-400">ยอดขายรวม</p>
        <p class="text-4xl font-black text-green-600"><span id="finTotal">0</span> ฿</p>
      </div>
      <div class="grid grid-cols-3 gap-2 text-center text-xs font-bold border-t pt-3">
        <div><p class="text-slate-400">โอนแล้ว</p><p id="finTransfer" class="text-blue-500 text-lg">0</p></div>
        <div><p class="text-slate-400">เงินสด</p><p id="finCash" class="text-emerald-500 text-lg">0</p></div>
        <div><p class="text-slate-400">ค้างจ่าย</p><p id="finUnpaid" class="text-red-500 text-lg">0</p></div>
      </div>
    </div>

    <div class="bg-white p-5 rounded-3xl shadow-sm border-t-4 border-blue-500">
      <h2 class="font-bold text-slate-500 text-sm mb-3">📦 ยอดผลิตรวม</h2>
      <div id="productionSummary" class="space-y-2 mb-4"></div>
      <h2 class="font-bold text-slate-500 text-sm mb-2 border-t pt-4">+ กดขายหน้าร้าน (เงินสด)</h2>
      <div class="grid grid-cols-2 gap-2" id="walkInButtons"></div>
    </div>

    <div class="bg-white p-5 rounded-3xl shadow-sm border-t-4 border-purple-500">
      <h2 class="font-bold text-slate-500 text-sm mb-3">🚚 รายการส่งของวันนี้</h2>
      <div id="deliveryList" class="space-y-3"></div>
    </div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzXgFrWaynovjrhBw5bJ1mhsL0J0Sr8fb25s5gJ_gO1-NvsN4zCZL4hYMmeDzpQ4gbedQ/exec"; 
    let allProducts = [];

    // ฟังก์ชันจัดการไฟสถานะ Admin
    function setApiStatus(isOnline) {
      const dot = document.getElementById('statusDot');
      if (isOnline) {
        dot.className = "w-2.5 h-2.5 rounded-full bg-green-500 shadow-[0_0_5px_#22c55e] mt-1";
      } else {
        dot.className = "w-2.5 h-2.5 rounded-full bg-red-500 shadow-[0_0_5px_#ef4444] mt-1";
      }
    }

    async function loadAdminData() {
      const btn = document.getElementById("btnRefresh");
      btn.innerText = "⏳ กำลังโหลด...";
      document.getElementById('statusDot').className = "w-2.5 h-2.5 rounded-full bg-yellow-400 animate-pulse mt-1"; // รีเซ็ตเป็นเหลือง
      
      try {
        const response = await fetch(GAS_URL + "?action=getAdminData");
        if(!response.ok) throw new Error("Network Error");
        const result = await response.json();
        
        allProducts = result.data.products;
        renderProductCrud();
        document.getElementById("finTotal").innerText = result.data.finance.total;
        document.getElementById("finTransfer").innerText = result.data.finance.transfer;
        document.getElementById("finCash").innerText = result.data.finance.cash;
        document.getElementById("finUnpaid").innerText = result.data.finance.unpaid;
        renderProduction(result.data.summary);
        renderWalkInButtons(result.data.summary);
        renderDelivery(result.data.orders);
        
        setApiStatus(true); // 🟢 สีเขียว
      } catch(e) { 
        alert("ขาดการเชื่อมต่อกับระบบ 🔴"); 
        setApiStatus(false); // 🔴 สีแดง
      }
      btn.innerText = "🔄 อัปเดต";
    }

    function renderProductCrud() {
      document.getElementById("productCrudList").innerHTML = allProducts.map(p => `
        <div class="flex justify-between items-center bg-white p-3 rounded-xl border border-slate-200 shadow-sm text-sm">
          <div>
            <p class="font-black text-slate-700">${p.name}</p>
            <p class="text-xs text-slate-500">${p.price}฿ | โควต้า: <span class="${p.stock > 0 ? 'text-green-600' : 'text-red-500'} font-bold">${p.stock}</span></p>
          </div>
          <div class="space-x-1 flex">
            <button onclick='editProduct(${JSON.stringify(p)})' class="bg-yellow-100 hover:bg-yellow-200 text-yellow-700 px-3 py-1 rounded-lg transition">✏️</button>
            <button onclick="deleteProduct('${p.id}', '${p.name}')" class="bg-red-100 hover:bg-red-200 text-red-700 px-3 py-1 rounded-lg transition">🗑️</button>
          </div>
        </div>
      `).join('');
    }

    function editProduct(p) {
      document.getElementById("prodId").value = p.id;
      document.getElementById("prodOldName").value = p.name;
      document.getElementById("prodName").value = p.name;
      document.getElementById("prodPrice").value = p.price;
      document.getElementById("prodStock").value = p.stock;
      document.getElementById("prodImg").value = p.imageUrl;
      document.getElementById("btnSaveProd").innerText = "🔄 อัปเดตเมนู";
    }

    function clearProductForm() {
      document.getElementById("prodId").value = ""; document.getElementById("prodOldName").value = "";
      document.getElementById("prodName").value = ""; document.getElementById("prodPrice").value = "";
      document.getElementById("prodStock").value = ""; document.getElementById("prodImg").value = "";
      document.getElementById("btnSaveProd").innerText = "💾 บันทึก";
    }

    async function saveProduct() {
      const id = document.getElementById("prodId").value; const oldName = document.getElementById("prodOldName").value;
      const name = document.getElementById("prodName").value; const price = document.getElementById("prodPrice").value;
      const stock = document.getElementById("prodStock").value; const img = document.getElementById("prodImg").value;
      if(!name || !price || !stock) return alert("ใส่ข้อมูลให้ครบครับ");
      const btn = document.getElementById("btnSaveProd"); btn.innerText = "⏳..."; btn.disabled = true;
      await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'manageProduct', data: { mode: id||oldName?'update':'create', id, oldName, name, price, stock, imageUrl: img }})});
      clearProductForm(); loadAdminData(); btn.disabled = false;
    }

    async function deleteProduct(id, name) {
      if(!confirm(`⚠️ ลบเมนู "${name}"?`)) return;
      await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'manageProduct', data: { mode: 'delete', id, oldName: name } }) });
      loadAdminData();
    }

    function renderProduction(summary) { document.getElementById("productionSummary").innerHTML = summary.map(item => `<div class="flex justify-between items-center border-b border-slate-50 pb-2"><span class="font-bold text-slate-700">${item.name}</span><span class="text-lg font-black text-blue-600 bg-blue-50 px-3 rounded-lg">${item.total}</span></div>`).join(''); }
    function renderWalkInButtons(summary) { document.getElementById("walkInButtons").innerHTML = summary.map(item => `<button onclick="quickSale('${item.name}', ${item.price})" class="bg-orange-50 hover:bg-orange-100 text-orange-700 py-2 rounded-xl text-xs font-bold border border-orange-200 transition active:scale-95">${item.name}</button>`).join(''); }
    async function quickSale(name, price) {
      if(!confirm(`บันทึกขายหน้าร้าน: ${name}?`)) return;
      await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'createOrder', data: { customerName: "ขายหน้างาน (Walk-in)", cart: [{name: name, qty: 1, price: price}], paymentMethod: "เงินสด", deliveryMethod: "รับเองหน้างาน" }})});
      loadAdminData();
    }

    function renderDelivery(orders) {
      document.getElementById("deliveryList").innerHTML = orders.map(order => {
        const isDelivered = order.deliveryStatus === 'ส่งแล้ว';
        const isPaid = order.payMethod === 'โอนเงิน' || order.payMethod === 'เงินสด';
        return `<div class="bg-slate-50 p-3 rounded-2xl border border-slate-100 text-sm"><div class="flex justify-between mb-1"><span class="font-black text-slate-800">${order.customer}</span><span class="text-xs font-bold text-purple-600 bg-purple-100 px-2 rounded">${order.deliveryMethod}</span></div><div class="text-slate-500 mb-3">${order.items.join(', ')}</div><div class="flex space-x-2"><button onclick="updateStatus('${order.orderId}', 'delivery', '${isDelivered ? 'ยังไม่ได้ส่ง' : 'ส่งแล้ว'}')" class="flex-1 py-2 rounded-lg font-bold text-xs transition ${isDelivered ? 'bg-green-500 text-white' : 'bg-slate-200 text-slate-600'}">${isDelivered ? '✅ ส่งแล้ว' : '📦 กดเมื่อส่งของ'}</button><select onchange="updateStatus('${order.orderId}', 'payment', this.value)" class="flex-1 border-none rounded-lg font-bold text-xs text-center outline-none ${isPaid ? 'bg-blue-100 text-blue-700' : 'bg-red-100 text-red-600'}"><option value="ค้างจ่าย" ${order.payMethod==='ค้างจ่าย'?'selected':''}>❌ ค้างจ่าย</option><option value="โอนเงิน" ${order.payMethod==='โอนเงิน'?'selected':''}>📱 โอนเงิน</option><option value="เงินสด" ${order.payMethod==='เงินสด'?'selected':''}>💵 เงินสด</option></select></div></div>`}).join('');
    }

    async function updateStatus(orderId, type, value) {
      await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'updateStatus', data: { orderId, type, value }}) });
      loadAdminData(); 
    }

    loadAdminData();
  </script>
</body>
</html>
