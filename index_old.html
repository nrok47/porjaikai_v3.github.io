<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ร้านพอใจขาย - Modern Hearth</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Plus Jakarta Sans', sans-serif; }
    .surface { background-color: #fff4ee; }
    .surface-container-low { background-color: #ffeee1; }
    .surface-container { background-color: #fff5f0; }
    .surface-container-high { background-color: #fffbf8; }
    .primary-orange { color: #f97f06; }
    .bg-primary { background-color: #f97f06; }
    .bg-primary-dark { background-color: #914700; }
    .bg-secondary { background-color: #176a21; }
    .bg-tertiary { background-color: #005caa; }
    .glass-card { 
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .shadow-xl-soft { box-shadow: 0 24px 48px rgba(0, 0, 0, 0.06); }
    .gradient-primary { background: linear-gradient(135deg, #f97f06 0%, #ff9d2c 100%); }
    .tab-btn { @apply px-4 py-2 font-bold text-sm transition duration-200 rounded-lg; }
    .tab-btn.active { @apply bg-primary text-white; }
    .badge { @apply inline-flex items-center space-x-1 px-3 py-1 rounded-full text-xs font-bold; }
    .badge-success { @apply bg-green-100 text-green-700; }
    .badge-warning { @apply bg-orange-100 text-orange-700; }
    .badge-info { @apply bg-blue-100 text-blue-700; }
  </style>
</head>
<body class="surface min-h-screen pb-24">
  <!-- Navigation with Glassmorphism -->
  <nav class="glass-card sticky top-0 z-50 border-b border-white border-opacity-20">
    <div class="flex justify-around p-3 max-w-2xl mx-auto">
      <button onclick="showTab('today')" class="tab-btn today-btn active bg-primary text-white">📊 วันนี้</button>
      <button onclick="showTab('order')" class="tab-btn order-btn bg-slate-200 text-slate-600">🛒 สั่งของ</button>
      <button onclick="showTab('admin')" class="tab-btn admin-btn bg-slate-200 text-slate-600">👑 จัดการ</button>
    </div>
  </nav>

  <div class="max-w-md mx-auto p-4">
    
    <div id="tab-today" class="tab-content space-y-4">
      <div class="flex justify-end mb-2">
        <div class="flex items-center space-x-1.5 bg-white px-2 py-1 rounded-full shadow-sm">
          <div id="statusDot" class="w-2 h-2 rounded-full bg-yellow-400 animate-pulse"></div>
          <span id="statusText" class="text-[10px] font-bold text-slate-500">กำลังเชื่อมต่อ...</span>
        </div>
      </div>

      <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
        <h2 class="text-orange-600 font-black text-lg mb-4 text-center">📋 สรุปรายการจองวันนี้</h2>
        <div id="todayLineSummary" class="space-y-6 text-sm leading-relaxed">
          <p class="text-center text-slate-400 animate-pulse">กำลังโหลดข้อมูล...</p>
        </div>
      </div>
    </div>

    <div id="tab-order" class="tab-content hidden space-y-6">
      
      <div id="myStatusSection" class="hidden bg-blue-50 p-4 rounded-2xl border border-blue-100 shadow-sm">
        <h3 class="font-bold text-blue-700 text-xs uppercase mb-2 flex items-center justify-between">
          <span>ออเดอร์ของคุณวันนี้:</span>
          <span id="profileName" class="text-slate-500 bg-white px-2 py-1 rounded-full text-[10px]">👤 โหลดข้อมูล...</span>
        </h3>
        <div id="myOrdersList" class="space-y-1"></div>
      </div>

      <div id="productList" class="space-y-3"></div>

      <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 space-y-5">
        <div>
          <label class="text-xs font-bold text-slate-400 uppercase">🚚 วิธีรับของ:</label>
          <div class="grid grid-cols-2 gap-2 mt-2">
             <button onclick="setDel('ส่งที่โต๊ะ', this)" class="del-btn border-orange-500 bg-orange-50 text-orange-600 p-3 rounded-xl text-sm font-bold border-2 transition">ส่งที่โต๊ะ</button>
             <button onclick="setDel('มารับเอง', this)" class="del-btn border-transparent bg-slate-100 text-slate-600 p-3 rounded-xl text-sm font-bold border-2 transition">มารับเอง</button>
          </div>
        </div>
        <div>
          <label class="text-xs font-bold text-slate-400 uppercase">💰 วิธีจ่ายเงิน:</label>
          <div class="grid grid-cols-2 gap-2 mt-2">
             <button onclick="setPay('โอนเงิน', this)" class="pay-btn border-orange-500 bg-orange-50 text-orange-600 p-3 rounded-xl text-sm font-bold border-2 transition">โอนเงิน</button>
             <button onclick="setPay('เงินสด', this)" class="pay-btn border-transparent bg-slate-100 text-slate-600 p-3 rounded-xl text-sm font-bold border-2 transition">เงินสด</button>
          </div>
        </div>

        <div id="slipArea" class="pt-4 border-t border-slate-50">
          <label class="cursor-pointer block border-2 border-dashed border-slate-200 rounded-xl p-4 text-center bg-slate-50 hover:bg-slate-100 transition">
            <span id="uploadLabel" class="text-xs font-bold text-slate-500">📸 แนบสลิปโอนเงิน</span>
            <input type="file" id="slipInput" accept="image/*" class="hidden" onchange="processImage(this)">
          </label>
          <img id="preview" class="hidden mt-3 rounded-xl max-h-40 mx-auto shadow-md border-2 border-white">
        </div>
      </div>

      <div class="bg-orange-500 text-white p-4 rounded-2xl shadow-lg flex justify-between items-center">
        <div>
          <p class="text-[10px] font-bold uppercase opacity-80">ยอดรวมทั้งหมด</p>
          <p class="text-3xl font-black"><span id="totalPrice">0</span> ฿</p>
        </div>
        <button onclick="submitOrder()" id="btnSubmit" disabled class="bg-white text-orange-600 font-black px-6 py-3 rounded-xl shadow-sm active:scale-95 disabled:opacity-50 transition">ยืนยัน 🚀</button>
      </div>
    </div>

    <div id="tab-admin" class="tab-content hidden space-y-4">
      
      <div class="bg-white p-5 rounded-3xl shadow-sm border-t-4 border-pink-500">
        <h3 class="font-bold text-slate-500 text-sm mb-3">📈 ภาพรวมยอดขายรายเดือน</h3>
        <canvas id="monthlyChart" height="200"></canvas>
      </div>

      <div class="bg-white p-5 rounded-3xl shadow-sm border-t-4 border-green-500">
        <h2 class="font-bold text-slate-500 text-sm mb-3">💰 สรุปการเงินวันนี้</h2>
        <div class="text-center mb-4">
          <p class="text-xs text-slate-400">ยอดขายรวม</p>
          <p class="text-4xl font-black text-green-600"><span id="finTotal">0</span> ฿</p>
        </div>
      </div>

      <div class="bg-white p-5 rounded-3xl shadow-sm border-t-4 border-purple-500">
        <div class="flex justify-between items-center mb-3">
          <h2 class="font-bold text-slate-500 text-sm">🚚 รายการส่งของวันนี้</h2>
          <button onclick="loadAdminData()" class="text-xs bg-slate-100 px-2 py-1 rounded-md font-bold">🔄 รีเฟรช</button>
        </div>
        <div id="deliveryList" class="space-y-3"></div>
      </div>

      <div class="bg-white p-5 rounded-3xl shadow-sm border-t-4 border-indigo-500">
        <h2 class="font-bold text-slate-500 text-sm mb-3">🛠️ จัดการสต็อก (วันนี้)</h2>
        <div id="productCrudList" class="space-y-2"></div>
      </div>

    </div>
  </div>

  <script>
    // ⚠️ เปลี่ยน URL ตรงนี้เป็นของใหม่ล่าสุดครับ
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxobiQN1X8Nrjj7_m_zLDKjCHil8RuQXHx6j9dDlNUH6iSQi2whD2GQmUda8UUX-iPQ-g/exec"; 
    
    let user = { id: "ADMIN_TEST", name: "ลูกค้าทั่วไป" }; // ค่า Default ตอนรันบนคอม
    let base64Image = "";
    let menuData = [];
    let cart = {};
    let allProducts = [];
    
    // ตั้งค่า Default ของปุ่มรับของ/จ่ายเงิน
    let deliveryMethod = 'ส่งที่โต๊ะ';
    let paymentMethod = 'โอนเงิน';

    // ==========================================
    // 1. ระบบจัดการ Tab & UI
    // ==========================================
    function showTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
      document.getElementById('tab-' + tabId).classList.remove('hidden');
      
      document.querySelectorAll('.tab-btn').forEach(b => {
        b.classList.remove('active-tab', 'text-orange-500', 'border-orange-500');
        b.classList.add('text-slate-400', 'border-transparent');
      });
      event.target.classList.remove('text-slate-400', 'border-transparent');
      event.target.classList.add('active-tab', 'text-orange-500', 'border-orange-500');
      
      if(tabId === 'admin') loadAdminData();
    }

    function setApiStatus(isOnline) {
      const dot = document.getElementById('statusDot');
      const text = document.getElementById('statusText');
      if (isOnline) {
        dot.className = "w-2 h-2 rounded-full bg-green-500 shadow-[0_0_5px_#22c55e]";
        text.innerText = "เชื่อมต่อแล้ว"; text.className = "text-[10px] font-bold text-green-600";
      } else {
        dot.className = "w-2 h-2 rounded-full bg-red-500 shadow-[0_0_5px_#ef4444]";
        text.innerText = "ระบบขัดข้อง"; text.className = "text-[10px] font-bold text-red-600";
      }
    }

    // ==========================================
    // 2. ฟังก์ชันแก้ไขปุ่มที่พัง (setDel, setPay)
    // ==========================================
    function setDel(method, btn) {
      deliveryMethod = method;
      document.querySelectorAll('.del-btn').forEach(el => {
        el.classList.remove('border-orange-500', 'bg-orange-50', 'text-orange-600');
        el.classList.add('border-transparent', 'bg-slate-100', 'text-slate-600');
      });
      btn.classList.remove('border-transparent', 'bg-slate-100', 'text-slate-600');
      btn.classList.add('border-orange-500', 'bg-orange-50', 'text-orange-600');
    }

    function setPay(method, btn) {
      paymentMethod = method;
      document.querySelectorAll('.pay-btn').forEach(el => {
        el.classList.remove('border-orange-500', 'bg-orange-50', 'text-orange-600');
        el.classList.add('border-transparent', 'bg-slate-100', 'text-slate-600');
      });
      btn.classList.remove('border-transparent', 'bg-slate-100', 'text-slate-600');
      btn.classList.add('border-orange-500', 'bg-orange-50', 'text-orange-600');

      const slipArea = document.getElementById('slipArea');
      if (method === 'โอนเงิน') {
        slipArea.classList.remove('hidden');
      } else {
        slipArea.classList.add('hidden');
        base64Image = ""; // ล้างรูปสลิปทิ้งถ้าเลือกเงินสด
        document.getElementById('preview').classList.add('hidden');
        document.getElementById('uploadLabel').innerText = "📸 แนบสลิปโอนเงิน";
      }
    }

    // ==========================================
    // 3. เริ่มต้นระบบ & โหลดข้อมูลลูกค้า
    // ==========================================
    async function init() {
      try {
        await liff.init({ liffId: "2009833407-3mbGMf7p" });
        if (liff.isLoggedIn()) {
          const profile = await liff.getProfile();
          user.id = profile.userId;
          user.name = profile.displayName;
        }
        document.getElementById("profileName").innerText = "👤 ผู้สั่ง: " + user.name;
      } catch (err) { console.log("Run on Web Browser"); }
      loadDashboard();
    }
    init();

    async function loadDashboard() {
      try {
        const response = await fetch(GAS_URL + "?action=getDashboard&lineId=" + user.id);
        const result = await response.json();
        
        menuData = result.data.products;
        renderMenu(); // สร้างหน้าเมนูสั่งของ

        // สร้างสรุปแบบโพสต์ไลน์ (Tab 1)
        const summaryDiv = document.getElementById('todayLineSummary');
        let lineText = "";
        if (menuData.length === 0) lineText = "<p class='text-center text-slate-400'>ยังไม่มีการเปิดรับออเดอร์จ้า</p>";
        menuData.forEach(p => {
          if(p.buyers.length > 0) {
            lineText += `<div class="border-b border-slate-100 pb-3"><p class="font-black text-slate-800">${p.name} (${p.price}.-)</p>`;
            p.buyers.forEach((b, i) => { lineText += `<p class="text-slate-600 ml-2">${i+1}. ${b}</p>`; });
            lineText += `</div>`;
          }
        });
        summaryDiv.innerHTML = lineText || "<p class='text-center text-slate-400'>ยังไม่มีคนจองเลย ประเดิมเป็นคนแรกสิ!</p>";

        // สร้างสถานะของฉัน
        if(result.data.myOrders.length > 0) {
          document.getElementById('myStatusSection').classList.remove('hidden');
          document.getElementById('myOrdersList').innerHTML = result.data.myOrders.map(o => 
            `<div class="flex justify-between text-xs py-1 border-b border-blue-100 last:border-0"><span class="font-medium">${o.name} x${o.qty}</span><span class="font-black">${o.payStatus} | ${o.delStatus}</span></div>`
          ).join('');
        }
        setApiStatus(true);
      } catch (error) { setApiStatus(false); }
    }

    function renderMenu() {
      const container = document.getElementById("productList");
      container.innerHTML = "";
      const fallbackImg = "https://placehold.co/150x150/ffedd5/f97316?text=Menu";

      menuData.forEach((item, index) => {
        cart[item.name] = { qty: 0, price: item.price };
        const isSoldOut = item.remaining <= 0;
        
        container.innerHTML += `
          <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-100 flex items-center space-x-3 ${isSoldOut ? 'opacity-60 grayscale' : ''}">
            <div class="w-16 h-16 bg-slate-100 rounded-xl overflow-hidden flex-shrink-0">
              <img src="${item.imageUrl || fallbackImg}" onerror="this.src='${fallbackImg}'" class="w-full h-full object-cover">
            </div>
            <div class="flex-grow">
              <h3 class="font-black text-slate-800 text-sm">${item.name}</h3>
              <p class="text-orange-500 font-bold text-xs">${item.price} ฿</p>
              <p class="text-[10px] font-bold text-slate-400 uppercase">เหลือ: ${item.remaining}</p>
            </div>
            <div class="flex items-center space-x-1 bg-slate-50 p-1 rounded-lg">
              <button onclick="updateQty('${item.name}', -1, ${item.remaining})" class="w-6 h-6 bg-white rounded-md shadow-sm font-bold text-slate-600">-</button>
              <span id="qty-${index}" class="w-5 text-center font-black text-slate-800 text-sm">0</span>
              <button onclick="updateQty('${item.name}', 1, ${item.remaining})" class="w-6 h-6 bg-orange-400 rounded-md shadow-sm font-bold text-white ${isSoldOut ? 'hidden' : ''}">+</button>
            </div>
          </div>
        `;
      });
    }

    function updateQty(name, change, max) {
      let newQty = cart[name].qty + change;
      if (newQty < 0) newQty = 0;
      if (newQty > max) { alert("เกินโควต้าที่เหลือจ้า"); newQty = max; }
      cart[name].qty = newQty;
      const idx = menuData.findIndex(p => p.name === name);
      document.getElementById(`qty-${idx}`).innerText = newQty;
      updateTotal();
    }

    function updateTotal() {
      let price = 0, items = 0;
      for (const k in cart) { price += (cart[k].qty * cart[k].price); items += cart[k].qty; }
      document.getElementById("totalPrice").innerText = price;
      document.getElementById("btnSubmit").disabled = items === 0;
    }

    // ==========================================
    // 4. จัดการรูปภาพ และส่งข้อมูล
    // ==========================================
    function processImage(input) {
      if (!input.files || !input.files[0]) return;
      document.getElementById('uploadLabel').innerText = "⏳ กำลังย่อขนาดรูป...";
      const reader = new FileReader();
      reader.readAsDataURL(input.files[0]);
      reader.onload = e => {
        const img = new Image();
        img.src = e.target.result;
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let w = img.width, h = img.height;
          if (w > h && w > 800) { h *= 800/w; w = 800; } else if (h > 800) { w *= 800/h; h = 800; }
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          base64Image = canvas.toDataURL('image/jpeg', 0.7);
          document.getElementById('preview').src = base64Image;
          document.getElementById('preview').classList.remove('hidden');
          document.getElementById('uploadLabel').innerText = "✅ แนบรูปเรียบร้อย";
        }
      }
    }

    async function submitOrder() {
      const btn = document.getElementById("btnSubmit");
      let items = [];
      for (const k in cart) if (cart[k].qty > 0) items.push({ name: k, qty: cart[k].qty, price: cart[k].price });
      
      btn.disabled = true; btn.innerText = "กำลังส่ง... ⏳";

      const payload = {
        action: "createOrder",
        data: {
          customerName: user.name, lineId: user.id, cart: items,
          deliveryMethod: deliveryMethod, paymentMethod: paymentMethod, slipBase64: base64Image
        }
      };

      try {
        const res = await fetch(GAS_URL, { method: "POST", body: JSON.stringify(payload) });
        if ((await res.json()).status === "success") { 
          alert("จองสำเร็จ! รอรับความอร่อยได้เลย 🎉"); 
          loadDashboard(); // โหลดข้อมูลใหม่
          showTab('today'); // เด้งกลับหน้าสรุป
        }
      } catch (err) { alert("เกิดข้อผิดพลาด 🔴"); }
      btn.disabled = false; btn.innerText = "ยืนยัน 🚀";
    }

    // ==========================================
    // 5. โหลดข้อมูลสำหรับ Admin & Chart.js
    // ==========================================
    async function loadAdminData() {
      try {
        const res = await fetch(GAS_URL + "?action=getAdminData");
        const result = await res.json();
        
        // การเงิน
        document.getElementById("finTotal").innerText = result.data.finance.total;
        
        // สต็อก (CRUD)
        allProducts = result.data.products;
        document.getElementById("productCrudList").innerHTML = allProducts.map(p => `
          <div class="flex justify-between items-center bg-slate-50 p-2 rounded-lg border text-sm mb-2">
            <div><p class="font-black text-slate-700">${p.name}</p><p class="text-xs">โควต้า: <span class="font-bold text-orange-600">${p.stock}</span></p></div>
            <button onclick="quickUpdateStock('${p.id}', '${p.name}', ${p.stock})" class="bg-indigo-100 text-indigo-700 px-3 py-1 rounded-md text-xs font-bold">แก้ไข</button>
          </div>
        `).join('');

        // ส่งของ
        document.getElementById("deliveryList").innerHTML = result.data.orders.map(order => {
          const isDelivered = order.deliveryStatus === 'ส่งแล้ว';
          return `
          <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 text-sm">
            <div class="flex justify-between"><span class="font-black">${order.customer}</span><span class="text-[10px] bg-purple-100 text-purple-600 px-1 rounded">${order.deliveryMethod}</span></div>
            <div class="text-slate-500 text-xs mb-2">${order.items.join(', ')}</div>
            <button onclick="updateStatus('${order.orderId}', 'delivery', '${isDelivered ? 'ยังไม่ได้ส่ง' : 'ส่งแล้ว'}')" class="w-full py-1.5 rounded-md font-bold text-xs transition ${isDelivered ? 'bg-green-500 text-white' : 'bg-slate-200 text-slate-600'}">${isDelivered ? '✅ ส่งแล้ว' : '📦 เช็กส่งของ'}</button>
          </div>`
        }).join('');

        // วาดกราฟ Chart.js
        renderChart(result.data.monthlyStats);
      } catch(e) { console.log(e); }
    }

    function renderChart(stats) {
      const ctx = document.getElementById('monthlyChart').getContext('2d');
      if(window.myChart) window.myChart.destroy();
      
      const labels = Object.keys(stats).sort();
      const data = labels.map(k => stats[k]);

      window.myChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{ label: 'รายได้ (บาท)', data: data, backgroundColor: '#f97316', borderRadius: 6 }]
        },
        options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
      });
    }

    async function updateStatus(orderId, type, value) {
      await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'updateStatus', data: { orderId, type, value }}) });
      loadAdminData(); 
    }

    async function quickUpdateStock(id, name, currentStock) {
      const newStock = prompt(`แก้จำนวนโควต้าของ ${name}:`, currentStock);
      if(newStock !== null) {
        await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'manageProduct', data: { mode: 'update', id: id, oldName: name, name: name, price: 0, stock: parseInt(newStock) }}) });
        loadAdminData();
      }
    }
  </script>

  <style>
    .active-tab { color: #f97316 !important; border-color: #f97316 !important; }
    .tab-btn { color: #94a3b8; border-color: transparent; }
  </style>
</body>
</html>
