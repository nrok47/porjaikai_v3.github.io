<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ร้านพอใจขาย - เปิดจอง</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body class="bg-orange-50 min-h-screen pb-32 font-sans">
  
  <div class="bg-white p-6 rounded-b-3xl shadow-sm text-center border-b-4 border-orange-400">
    <h1 class="text-2xl font-black text-gray-800">🛒 ร้านพอใจขาย</h1>
    <p class="text-orange-600 font-bold mt-1">เปิดรับออเดอร์พรุ่งนี้จ้า!</p>
    <p id="profileName" class="text-sm text-gray-500 mt-2 bg-gray-100 inline-block px-3 py-1 rounded-full">👤 โหลดข้อมูล...</p>
  </div>

  <div id="productList" class="p-4 space-y-4 max-w-md mx-auto mt-2">
    <p class="text-center text-gray-500 text-sm animate-pulse">กำลังโหลดเมนูวันนี้...</p>
  </div>

  <div class="fixed bottom-0 left-0 w-full bg-white border-t border-gray-200 p-4 shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.1)] z-50">
    <div class="max-w-md mx-auto">
      
      <div class="mb-3">
        <label class="cursor-pointer block border-2 border-dashed border-orange-200 rounded-xl p-2 text-center bg-orange-50 hover:bg-orange-100 transition">
          <span id="uploadLabel" class="text-sm font-bold text-orange-600">📸 แนบสลิปโอนเงิน (ถ้ามี)</span>
          <input type="file" id="slipInput" accept="image/*" class="hidden" onchange="processImage(this)">
        </label>
        <img id="preview" class="hidden mt-2 rounded-lg max-h-24 mx-auto shadow-sm">
      </div>

      <div class="flex justify-between items-center mb-3">
        <span class="text-gray-600 font-bold">ยอดรวม <span id="totalItems" class="text-orange-500">0</span> รายการ</span>
        <span class="text-2xl font-black text-gray-800"><span id="totalPrice">0</span> ฿</span>
      </div>
      <button onclick="submitOrder()" id="btnSubmit" class="w-full bg-orange-500 text-white font-black py-4 rounded-xl shadow-lg active:scale-95 transition disabled:opacity-50 disabled:active:scale-100">
        ยืนยันการจอง 🚀
      </button>
    </div>
  </div>

  <script>
    const LIFF_ID = "2009833407-3mbGMf7p"; 
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzXgFrWaynovjrhBw5bJ1mhsL0J0Sr8fb25s5gJ_gO1-NvsN4zCZL4hYMmeDzpQ4gbedQ/exec"; // อย่าลืมแก้เป็น URL ล่าสุดนะครับ
    
    let user = { id: "", name: "ลูกค้าทั่วไป" };
    let base64Image = "";
    let menuData = [];
    let cart = {}; // { "กระเพรา": { qty: 2, price: 70 } }

    async function init() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (liff.isLoggedIn()) {
          const profile = await liff.getProfile();
          user.id = profile.userId;
          user.name = profile.displayName;
        }
        document.getElementById("profileName").innerText = "👤 ผู้สั่ง: " + user.name;
      } catch (err) { console.log("LIFF Error, running in browser"); }
      loadDashboard();
    }
    init();

    async function loadDashboard() {
      try {
        const response = await fetch(GAS_URL + "?action=getDashboard");
        const result = await response.json();
        menuData = result.data;
        renderProducts();
      } catch (e) {
        document.getElementById("productList").innerHTML = "<p class='text-center text-red-500'>โหลดข้อมูลไม่สำเร็จ กรุณารีเฟรช</p>";
      }
    }

    function renderProducts() {
      const container = document.getElementById("productList");
      container.innerHTML = "";

      menuData.forEach((item, index) => {
        cart[item.name] = { qty: 0, price: item.price }; // ตั้งค่าเริ่มต้นตะกร้า
        const isSoldOut = item.remaining <= 0;
        
        // จัดการรายชื่อคนจอง
        let buyersHTML = "";
        if (item.buyers.length > 0) {
          const names = item.buyers.join(", ");
          buyersHTML = `<p class="text-xs text-gray-500 mt-2 bg-gray-50 p-2 rounded-lg">📋 คนจอง: <span class="font-medium text-gray-700">${names}</span></p>`;
        }

        const card = `
          <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 ${isSoldOut ? 'opacity-70' : ''}">
            <div class="flex justify-between items-start">
              <div>
                <h3 class="font-black text-gray-800 text-lg">${item.name}</h3>
                <p class="text-orange-500 font-bold">${item.price} บาท</p>
                <div class="mt-1 inline-block bg-${isSoldOut ? 'red' : 'green'}-100 text-${isSoldOut ? 'red' : 'green'}-700 text-xs px-2 py-1 rounded-md font-bold">
                  ${isSoldOut ? 'หมดแล้ว ❌' : `ว่าง ${item.remaining} / ${item.quota}`}
                </div>
              </div>
              
              <div class="flex items-center space-x-3 bg-gray-50 rounded-xl p-1">
                <button onclick="updateQty('${item.name}', -1, ${item.remaining})" class="w-8 h-8 flex items-center justify-center bg-white rounded-lg shadow-sm text-gray-600 font-bold active:scale-90">-</button>
                <span id="qty-${index}" class="font-black text-gray-800 w-4 text-center">0</span>
                <button onclick="updateQty('${item.name}', 1, ${item.remaining})" class="w-8 h-8 flex items-center justify-center bg-orange-400 text-white rounded-lg shadow-sm font-bold active:scale-90" ${isSoldOut ? 'disabled' : ''}>+</button>
              </div>
            </div>
            ${buyersHTML}
          </div>
        `;
        container.innerHTML += card;
      });
    }

    function updateQty(itemName, change, maxRemaining) {
      const currentQty = cart[itemName].qty;
      let newQty = currentQty + change;
      
      if (newQty < 0) newQty = 0;
      if (newQty > maxRemaining) {
        alert("ขออภัยครับ สั่งเกินจำนวนโควต้าที่เหลืออยู่ 🙏");
        newQty = maxRemaining;
      }
      
      cart[itemName].qty = newQty;
      
      // Update UI number
      const itemIndex = menuData.findIndex(p => p.name === itemName);
      document.getElementById(`qty-${itemIndex}`).innerText = newQty;
      
      updateTotal();
    }

    function updateTotal() {
      let sumPrice = 0;
      let sumItems = 0;
      for (const [name, data] of Object.entries(cart)) {
        sumPrice += (data.qty * data.price);
        sumItems += data.qty;
      }
      document.getElementById("totalPrice").innerText = sumPrice;
      document.getElementById("totalItems").innerText = sumItems;
      
      const btn = document.getElementById("btnSubmit");
      btn.disabled = sumItems === 0; // ปิดปุ่มถ้ายังไม่เลือกของ
    }

    // ระบบย่อรูป
    function processImage(input) {
      if (!input.files || !input.files[0]) return;
      const file = input.files[0];
      const label = document.getElementById('uploadLabel');
      label.innerText = "⏳ กำลังย่อรูป...";
      
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = event => {
        const img = new Image();
        img.src = event.target.result;
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let width = img.width, height = img.height;
          if (width > height && width > 800) { height = Math.round(height * 800 / width); width = 800; } 
          else if (height > 800) { width = Math.round(width * 800 / height); height = 800; }
          
          canvas.width = width; canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          
          base64Image = canvas.toDataURL('image/jpeg', 0.7);
          document.getElementById('preview').src = base64Image;
          document.getElementById('preview').classList.remove('hidden');
          label.innerText = "✅ แนบรูปแล้ว (คลิกเพื่อเปลี่ยน)";
        };
      };
    }

    async function submitOrder() {
      const btn = document.getElementById("btnSubmit");
      
      // รวบรวมเฉพาะของที่สั่ง
      let orderedItems = [];
      for (const [name, data] of Object.entries(cart)) {
        if (data.qty > 0) orderedItems.push({ name: name, qty: data.qty, price: data.price });
      }

      if (orderedItems.length === 0) return;

      btn.disabled = true;
      btn.innerText = "กำลังส่งออเดอร์... ⏳";

      const payload = {
        action: "createOrder",
        data: {
          customerName: user.name,
          lineId: user.id,
          cart: orderedItems,
          slipBase64: base64Image
        }
      };

      try {
        const response = await fetch(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });
        const result = await response.json();
        
        if (result.status === "success") {
          alert("จองสำเร็จเรียบร้อย! ขอบคุณครับ 🎉");
          liff.closeWindow();
        } else { throw new Error(result.message); }
      } catch (err) {
        alert("เกิดข้อผิดพลาด: " + err.message);
        btn.disabled = false;
        btn.innerText = "ยืนยันการจอง 🚀";
      }
    }
  </script>
</body>
</html>
