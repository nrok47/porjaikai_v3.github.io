<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body class="bg-gray-100 p-4 font-sans">
  <div class="bg-white max-w-md mx-auto rounded-3xl shadow-lg overflow-hidden border-t-8 border-yellow-400">
    <div class="p-6">
      <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">🌽 ครัวคุณลัดดา</h1>
      
      <div class="space-y-4">
        <div>
          <label class="text-sm font-semibold text-gray-600">วันนี้คุณลัดดาขายอะไร:</label>
          <select id="productSelect" class="w-full border-2 border-gray-100 p-3 rounded-xl mt-1 focus:border-yellow-400 outline-none" onchange="updateTotal()">
            <option value="น้ำข้าวโพด" data-price="35">น้ำข้าวโพด (35.-)</option>
            <option value="น้ำฟักทอง" data-price="40">น้ำฟักทอง (40.-)</option>
            <option value="ข้าวกล่อง" data-price="55">ข้าวกล่อง (55.-)</option>
          </select>
        </div>

        <div>
          <label class="text-sm font-semibold text-gray-600">ระบุจำนวน:</label>
          <input type="number" id="qty" value="1" min="1" class="w-full border-2 border-gray-100 p-3 rounded-xl mt-1 text-center text-xl" oninput="updateTotal()">
        </div>

        <div class="bg-yellow-50 p-4 rounded-2xl text-center">
          <p class="text-gray-600 text-sm">ยอดรวมที่ต้องชำระ</p>
          <p class="text-3xl font-black text-yellow-600"><span id="totalDisplay">35</span> ฿</p>
        </div>

        <div class="border-2 border-dashed border-gray-200 p-4 rounded-2xl">
          <label class="block text-sm font-semibold text-gray-600 text-center cursor-pointer">
            <span>📸 แนบสลิปโอนเงิน (ถ้ามี)</span>
            <input type="file" id="slipInput" accept="image/*" class="hidden" onchange="previewImage(this)">
          </label>
          <img id="preview" class="hidden mt-2 rounded-lg max-h-40 mx-auto">
        </div>

        <button onclick="sendOrder()" id="btnSubmit" class="w-full bg-yellow-400 py-4 rounded-2xl font-bold text-yellow-900 shadow-md active:scale-95 transition-all">
          ยืนยันการจอง / แจ้งโอน
        </button>
      </div>
    </div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzXgFrWaynovjrhBw5bJ1mhsL0J0Sr8fb25s5gJ_gO1-NvsN4zCZL4hYMmeDzpQ4gbedQ/exec";
    let base64Image = "";

    async function init() {
      await liff.init({ liffId: "2009833407-3mbGMf7p" });
      if (!liff.isLoggedIn()) liff.login();
    }
    init();

    function previewImage(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById('preview').src = e.target.result;
          document.getElementById('preview').classList.remove('hidden');
          base64Image = e.target.result;
        }
        reader.readAsDataURL(input.files[0]);
      }
    }

    function updateTotal() {
      const select = document.getElementById("productSelect");
      const price = select.options[select.selectedIndex].getAttribute("data-price");
      const qty = document.getElementById("qty").value;
      document.getElementById("totalDisplay").innerText = price * qty;
    }

    async function sendOrder() {
      const btn = document.getElementById("btnSubmit");
      btn.disabled = true;
      btn.innerText = "กำลังประมวลผล...";

      const profile = await liff.getProfile();
      const select = document.getElementById("productSelect");
      
      const payload = {
        action: "createOrder",
        data: {
          customerName: profile.displayName,
          productName: select.value,
          qty: document.getElementById("qty").value,
          totalPrice: document.getElementById("totalDisplay").innerText,
          slipBase64: base64Image
        }
      };

      const response = await fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      });
      const result = await response.json();

      if (result.status === "success") {
        alert("บันทึกข้อมูลเรียบร้อยแล้วค่ะ!");
        liff.closeWindow();
      }
    }
  </script>
</body>
</html>
