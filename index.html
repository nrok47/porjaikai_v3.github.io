<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ร้านพอใจขาย v7</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-50 min-h-screen pb-20 font-sans">

  <nav class="bg-white shadow-sm sticky top-0 z-50 border-b border-orange-100">
    <div class="flex justify-around p-3 max-w-md mx-auto">
      <button onclick="showTab('today')" class="tab-btn font-bold text-slate-400 border-b-2 border-transparent px-2 pb-1 active-tab">ออเดอร์วันนี้</button>
      <button onclick="showTab('order')" class="tab-btn font-bold text-slate-400 border-b-2 border-transparent px-2 pb-1">สั่งของ</button>
      <button onclick="showTab('admin')" class="tab-btn font-bold text-slate-400 border-b-2 border-transparent px-2 pb-1">Admin</button>
    </div>
  </nav>

  <div class="max-w-md mx-auto p-4">
    
    <div id="tab-today" class="tab-content space-y-4">
      <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
        <h2 class="text-orange-600 font-black text-lg mb-4 text-center">📋 สรุปรายการจองวันนี้</h2>
        <div id="todayLineSummary" class="space-y-6 text-sm leading-relaxed">
          </div>
      </div>
    </div>

    <div id="tab-order" class="tab-content hidden space-y-6">
      <div id="myStatusSection" class="hidden bg-blue-50 p-4 rounded-2xl border border-blue-100">
        <h3 class="font-bold text-blue-700 text-xs uppercase mb-2">ออเดอร์ของคุณวันนี้:</h3>
        <div id="myOrdersList" class="space-y-1"></div>
      </div>

      <div id="productList" class="space-y-3"></div>

      <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 space-y-4">
        <div>
          <label class="text-xs font-bold text-slate-400 uppercase">วิธีรับของ:</label>
          <div class="grid grid-cols-2 gap-2 mt-1">
             <button onclick="setDel('ส่งที่โต๊ะ')" class="del-btn bg-slate-100 p-2 rounded-xl text-sm font-bold border-2 border-transparent">ส่งที่โต๊ะ</button>
             <button onclick="setDel('มารับเอง')" class="del-btn bg-slate-100 p-2 rounded-xl text-sm font-bold border-2 border-transparent">มารับเอง</button>
          </div>
        </div>
        <div>
          <label class="text-xs font-bold text-slate-400 uppercase">วิธีจ่ายเงิน:</label>
          <div class="grid grid-cols-2 gap-2 mt-1">
             <button onclick="setPay('โอนเงิน')" class="pay-btn bg-slate-100 p-2 rounded-xl text-sm font-bold border-2 border-transparent">โอนเงิน</button>
             <button onclick="setPay('เงินสด')" class="pay-btn bg-slate-100 p-2 rounded-xl text-sm font-bold border-2 border-transparent">เงินสด</button>
          </div>
        </div>
      </div>
      <button onclick="submitOrder()" class="w-full bg-orange-500 text-white font-black py-4 rounded-2xl shadow-lg">ยืนยันการสั่ง 🚀</button>
    </div>

    <div id="tab-admin" class="tab-content hidden space-y-4">
      <div class="bg-white p-5 rounded-3xl shadow-sm border-t-4 border-green-500">
        <h3 class="font-bold text-slate-400 text-xs mb-3">ภาพรวมยอดขายรายเดือน</h3>
        <canvas id="monthlyChart" height="200"></canvas>
      </div>
      </div>

  </div>

  <script>
    // การเปลี่ยนแท็บ
    function showTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
      document.getElementById('tab-' + tabId).classList.remove('hidden');
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active-tab', 'text-orange-500', 'border-orange-500'));
      event.target.classList.add('active-tab', 'text-orange-500', 'border-orange-500');
      if(tabId === 'admin') loadAdminData();
    }

    // ฟังก์ชันดึงข้อมูลมาแสดงแบบโพสต์ไลน์
    async function loadDashboard() {
      const res = await fetch(GAS_URL + "?action=getDashboard&lineId=" + user.id);
      const result = await res.json();
      
      // Render Line Style Summary
      const summaryDiv = document.getElementById('todayLineSummary');
      let lineText = "";
      result.data.products.forEach(p => {
        lineText += `<div class="border-b pb-3"><p class="font-black text-slate-800">${p.name} ${p.price}.-</p>`;
        p.buyers.forEach((b, i) => {
          lineText += `<p class="text-slate-600">${i+1}. ${b}</p>`;
        });
        lineText += `</div>`;
      });
      summaryDiv.innerHTML = lineText;

      // Render My Orders Status
      if(result.data.myOrders.length > 0) {
        document.getElementById('myStatusSection').classList.remove('hidden');
        document.getElementById('myOrdersList').innerHTML = result.data.myOrders.map(o => 
          `<div class="flex justify-between text-xs"><span>${o.name} x${o.qty}</span><span class="font-bold">${o.payStatus} | ${o.delStatus}</span></div>`
        ).join('');
      }
    }
  </script>

  <style>
    .active-tab { color: #f97316; border-color: #f97316; }
  </style>
</body>
</html>
