<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สั่งของร้านคุณลัดดา</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body class="bg-slate-50 min-h-screen p-4 font-sans">
  <div class="max-w-md mx-auto bg-white rounded-3xl shadow-xl overflow-hidden border-t-8 border-yellow-400">
    <div class="p-6">
      <h1 class="text-2xl font-black text-center text-slate-800 mb-2">🌽 ครัวคุณลัดดา</h1>
      <p id="profileName" class="text-center text-slate-400 text-sm mb-6 font-medium">โหลดข้อมูลโปรไฟล์...</p>
      
      <div class="space-y-5">
        <div>
          <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">เมนูวันนี้:</label>
          <select id="productSelect" class="w-full border-2 border-slate-100 p-3 rounded-xl mt-1 focus:border-yellow-400 outline-none appearance-none bg-white" onchange="updateTotal()">
            <option value="" disabled selected>กำลังโหลดเมนู...</option>
          </select>
        </div>

        <div>
          <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">จำนวนที่ต้องการ:</label>
          <input type="number" id="qty" value="1" min="1" class="w-full border-2 border-slate-100 p-3 rounded-xl mt-1 text-center text-xl font-bold" oninput="updateTotal()">
        </div>

        <div class="bg-yellow-50 p-5 rounded-2xl text-center">
          <p class="text-slate-500 text-xs font-bold uppercase mb-1">ยอดรวมทั้งหมด</p>
          <p class="text-4xl font-black text-yellow-600"><span id="totalDisplay">0</span> <span class="text-xl">฿</span></p>
        </div>

        <div class="border-2 border-dashed border-slate-200 p-5 rounded-2xl bg-slate-50 text-center">
          <label class="cursor-pointer block">
            <span class="text-slate-500 font-bold block mb-2 text-sm">📸 แนบสลิปโอนเงิน (ถ้ามี)</span>
            <input type="file" id="slipInput" accept="image/*" class="hidden" onchange="processImage(this)">
            <div id="btnUpload" class="inline-block bg-white px-4 py-2 rounded-lg shadow-sm text-xs font-bold text-yellow-600 border border-yellow-100">เลือกรูปภาพ</div>
          </label>
          <img id="preview" class="hidden mt-4 rounded-xl max-h-48 mx-auto shadow-md border-4 border-white">
        </div>

        <button onclick="sendOrder()" id="btnSubmit" class="w-full bg-yellow-400 py-5 rounded-2xl font-black text-yellow-900 shadow-lg active:scale-95 transition-all text-lg uppercase tracking-wide">
          ยืนยันการจอง / แจ้งโอน
        </button>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // CONFIGURATION
    // ==========================================
    const LIFF_ID = "2009833407-3mbGMf7p"; 
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzXgFrWaynovjrhBw5bJ1mhsL0J0Sr8fb25s5gJ_gO1-NvsN4zCZL4hYMmeDzpQ4gbedQ/exec"; // ถ้าเพิ่ง Deploy ใหม่ อย่าลืมเอาลิงก์ใหม่มาใส่นะครับ
    
    let user = { id: "", name: "ลูกค้าทั่วไป" };
    let base64Image = "";

    // 1. เริ่มต้น LIFF และโหลดเมนู
    async function init() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (liff.isLoggedIn()) {
          const profile = await liff.getProfile();
          user.id = profile.userId;
          user.name = profile.displayName;
        }
        document.getElementById("profileName").innerText = "ผู้สั่ง: " + user.name;
      } catch (err) {
        document.getElementById("profileName").innerText = "ใช้งานผ่าน Web Browser";
      }
      loadProducts();
    }
    init();

    // 2. โหลดรายการสินค้าจาก Sheet
    async function loadProducts() {
      try {
        const response = await fetch(GAS_URL + "?action=getProducts");
        const result = await response.json();
        const select = document.getElementById("productSelect");
        select.innerHTML = "";
        result.data.forEach(p => {
          let opt = document.createElement("option");
          opt.value = p.name;
          opt.dataset.price = p.price;
          opt.innerText = `${p.name} (${p.price}.-)`;
          select.appendChild(opt);
        });
        updateTotal();
      } catch (e) {
        alert("ไม่สามารถโหลดเมนูได้ กรุณารีเฟรชหน้าจอ");
      }
    }

    function updateTotal() {
      const select = document.getElementById("productSelect");
      const price = select.options[select.selectedIndex]?.dataset.price || 0;
      const qty = document.getElementById("qty").value;
      document.getElementById("totalDisplay").innerText = price * qty;
    }

    // 3. ระบบบีบอัดรูปภาพ
    function processImage(input) {
      if (!input.files || !input.files[0]) return;
      const file = input.files[0];
      const btnUpload = document.getElementById('btnUpload');
      btnUpload.innerText = "กำลังย่อขนาดรูป...";
      
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = event => {
        const img = new Image();
        img.src = event.target.result;
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let width = img.width, height = img.height;
          const maxSize = 800; // ไม่เกิน 800px

          if (width > height && width > maxSize) {
            height = Math.round(height * maxSize / width);
            width = maxSize;
          } else if (height > maxSize) {
            width = Math.round(width * maxSize / height);
            height = maxSize;
          }

          canvas.width = width; canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          
          base64Image = canvas.toDataURL('image/jpeg', 0.7); // ย่อเหลือ 70%
          document.getElementById('preview').src = base64Image;
          document.getElementById('preview').classList.remove('hidden');
          btnUpload.innerText = "เปลี่ยนรูปภาพ";
        };
      };
    }

    // 4. ส่งข้อมูลไปที่ Google Sheets
    async function sendOrder() {
      const btn = document.getElementById("btnSubmit");
      const select = document.getElementById("productSelect");
      
      if (!select.value) {
        alert("กรุณารอโหลดเมนู หรือเลือกเมนูก่อนครับ");
        return;
      }

      btn.disabled = true;
      btn.innerText = "กำลังประมวลผล...";

      const payload = {
        action: "createOrder",
        data: {
          customerName: user.name,
          lineId: user.id,
          productName: select.value,
          qty: document.getElementById("qty").value,
          totalPrice: document.getElementById("totalDisplay").innerText,
          slipBase64: base64Image
        }
      };

      try {
        const response = await fetch(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" }, // เลี่ยงปัญหา CORS Block
          body: JSON.stringify(payload)
        });
        
        const result = await response.json();
        
        if (result.status === "success") {
          alert("บันทึกออเดอร์สำเร็จ! 🎉");
          liff.closeWindow(); 
        } else {
          throw new Error(result.message);
        }
      } catch (err) {
        alert("เกิดข้อผิดพลาด: " + err.message);
        btn.disabled = false;
        btn.innerText = "ลองใหม่อีกครั้ง";
      }
    }
  </script>
</body>
</html>
